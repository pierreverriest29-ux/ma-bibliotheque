<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Bibliothèque</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0; padding: 15px;
  background: #f5f6fa;
  color: #2f3640;
}

h2 {
  text-align: center;
  color: #40739e;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 5px 0 10px 0;
  border-radius: 8px;
  border: 1px solid #dcdde1;
}

button {
  padding: 10px 15px;
  margin: 5px 0;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

button:hover { opacity: 0.9; }

button.scan { background-color: #44bd32; color: white; }
button.close { background-color: #e84118; color: white; }
button.read { background-color: #273c75; color: white; }

#books { margin-top: 15px; }

.book {
  background: white;
  border-radius: 15px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  padding: 15px;
  margin-top: 15px;
}

.book b { color: #40739e; font-size: 1.1em; }
.book small { color: #718093; }
.book button { margin-top: 10px; border-radius: 8px; }
.filter-container {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}
.filter-container input, .filter-container select { flex: 1; }
</style>
</head>

<body>
<h2>📚 Ma Bibliothèque</h2>

<!-- Scanner -->
<button class="scan" onclick="startScan()">📷 Scanner un ISBN</button>
<button class="close" onclick="stopScan()">❌ Fermer le scanner</button>
<div id="reader"></div>

<!-- Ajout manuel -->
<input id="isbn" placeholder="Entrez un ISBN">
<input id="titre" placeholder="Titre (facultatif)">
<input id="auteur" placeholder="Auteur (facultatif)">
<input id="serie" placeholder="Série">
<input id="tome" type="number" placeholder="Tome">
<input id="format" placeholder="Format (poche, relié, manga...)">
<input id="edition" placeholder="Édition spéciale">
<button class="read" onclick="fetchBook()">➕ Ajouter le livre</button>

<!-- Filtres -->
<div class="filter-container">
  <input id="searchAuteur" placeholder="Filtrer par auteur" oninput="render()">
  <input id="searchSerie" placeholder="Filtrer par série" oninput="render()">
</div>

<!-- Liste -->
<div id="books"></div>

<script>
let books = JSON.parse(localStorage.getItem("books") || "[]");
let qr = null;

// Sauvegarder et afficher
function save() {
  localStorage.setItem("books", JSON.stringify(books));
  render();
}

// Affichage avec filtres et tomes manquants
function render() {
  const filterAuteur = document.getElementById("searchAuteur").value.toLowerCase();
  const filterSerie = document.getElementById("searchSerie").value.toLowerCase();

  document.getElementById("books").innerHTML = books
    .filter(b =>
      b.author.toLowerCase().includes(filterAuteur) &&
      b.serie.toLowerCase().includes(filterSerie)
    )
    .sort((a,b) => (a.serie||"").localeCompare(b.serie||"") || (a.tome||0)-(b.tome||0))
    .map((b, i) =>
    `<div class="book">
      <b>${b.title}</b>
      <span>${b.author}</span><br>
      <small>ISBN: ${b.isbn}</small><br>
      Série: ${b.serie || "-"} | Tome: ${b.tome || "-"}<br>
      Format: ${b.format || "-"} | Édition: ${b.edition || "-"}<br>
      <button class="read" onclick="toggleRead(${i})">
        ${b.read ? "📘 Marquer non lu" : "📗 Marquer lu"}
      </button>
      <button onclick="deleteBook(${i})" style="background:#e1b12c; color:white;">🗑 Supprimer</button>
    </div>`
  ).join("");
}

// Ajouter un livre
function fetchBook() {
  const input = document.getElementById("isbn");
  const isbn = input.value.trim();
  if (!isbn) { alert("Entre un ISBN"); return; }

  const titre = document.getElementById("titre").value.trim();
  const auteur = document.getElementById("auteur").value.trim();
  const serie = document.getElementById("serie").value.trim();
  const tome = document.getElementById("tome").value;
  const format = document.getElementById("format").value.trim();
  const edition = document.getElementById("edition").value.trim();

  fetch(`https://openlibrary.org/isbn/${isbn}.json`)
    .then(res => {
      if (!res.ok) throw new Error("Livre non trouvé");
      return res.json();
    })
    .then(data => {
      books.push({
        isbn,
        title: titre || data.title || "Titre inconnu",
        author: auteur || (data.authors ? data.authors.map(a=>a.name).join(", ") : "Auteur inconnu"),
        serie, tome: tome||null, format, edition,
        read: false
      });
      save(); resetFields();
      stopScan();
    })
    .catch(() => {
      books.push({
        isbn,
        title: titre || "À compléter",
        author: auteur || "À compléter",
        serie, tome: tome||null, format, edition,
        read: false
      });
      save(); resetFields();
      alert("Livre ajouté sans infos automatiques");
    });
}

// Reset champs après ajout
function resetFields() {
  ["isbn","titre","auteur","serie","tome","format","edition"].forEach(id=>document.getElementById(id).value="");
}

// Lu / Non lu
function toggleRead(index) {
  books[index].read = !books[index].read;
  save();
}

// Supprimer livre
function deleteBook(index) {
  if (confirm("Supprimer ce livre ?")) {
    books.splice(index,1);
    save();
  }
}

// Scanner
function startScan() {
  if (qr) stopScan();

  qr = new Html5Qrcode("reader");

  // Paramètres optimisés
  const config = {
    fps: 20,             // Fréquence de lecture, plus fluide
    qrbox: 400,          // Zone de scan plus grande
    experimentalFeatures: {
      useBarCodeDetectorIfSupported: true
    }
  };
  
qr.start(
  { 
    facingMode: "environment",
    width: 1920,  // largeur max
    height: 1080  // hauteur max
  },
  { fps: 20, qrbox: 400, experimentalFeatures: { useBarCodeDetectorIfSupported: true } },
  text => {
    document.getElementById("isbn").value = text;
    stopScan();
  },
  err => {}
);



// Fermer scanner
function stopScan() {
  if (qr) {
    qr.stop().then(()=>{
      qr.clear();
      document.getElementById("reader").innerHTML="";
      qr=null;
    }).catch(err=>console.log(err));
  }
}

render();
</script>

</body>
</html>
