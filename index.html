<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ma Bibliothèque</title>

<script src="https://unpkg.com/html5-qrcode"></script>

<style>
/* Style global */
body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  margin: 0;
  padding: 15px;
  background: #f5f6fa;
  color: #2f3640;
}

/* Titres */
h2 {
  text-align: center;
  color: #40739e;
}

/* Boutons modernes */
button {
  padding: 10px 15px;
  margin: 5px 0;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  transition: 0.2s;
}

button:hover {
  opacity: 0.9;
}

/* Boutons spécifiques */
button.scan { background-color: #44bd32; color: white; }
button.close { background-color: #e84118; color: white; }
button.read { background-color: #273c75; color: white; }

/* Input ISBN */
input#isbn {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #dcdde1;
  margin-bottom: 10px;
}

/* Liste des livres sous forme de cartes */
.book {
  background: white;
  border-radius: 15px;
  box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
  padding: 15px;
  margin-top: 15px;
  display: flex;
  flex-direction: column;
}

.book b {
  color: #40739e;
  font-size: 1.1em;
  margin-bottom: 5px;
}

.book button {
  margin-top: 10px;
  border-radius: 8px;
}
</style>
</head>

<body>

<h2>📚 Ma Bibliothèque</h2>

<!-- Scanner -->
<button class="scan" onclick="startScan()">📷 Scanner un ISBN</button>
<button class="close" onclick="stopScan()">❌ Fermer le scanner</button>
<div id="reader"></div>

<!-- Ajouter ISBN manuellement -->
<input id="isbn" placeholder="Entrez un ISBN">
<button class="read" onclick="fetchBook()">➕ Ajouter le livre</button>

<!-- Liste des livres -->
<div id="books"></div>

<script>
let books = JSON.parse(localStorage.getItem("books") || "[]");
let qr = null;

// Sauvegarder et re-render
function save() {
  localStorage.setItem("books", JSON.stringify(books));
  render();
}

// Afficher les livres
function render() {
  document.getElementById("books").innerHTML = books.map((b, i) =>
    `<div class="book">
      <b>${b.title}</b>
      <span>${b.author}</span><br>
      <small>ISBN : ${b.isbn}</small><br>
      <button class="read" onclick="toggleRead(${i})">
        ${b.read ? "📘 Marquer non lu" : "📗 Marquer lu"}
      </button>
    </div>`
  ).join("");
}

// Ajouter un livre
function fetchBook() {
  const input = document.getElementById("isbn");
  const isbn = input.value.trim();
  if (!isbn) { alert("Entre un ISBN"); return; }

  fetch(`https://openlibrary.org/isbn/${isbn}.json`)
    .then(response => {
      if (!response.ok) throw new Error("Livre non trouvé");
      return response.json();
    })
    .then(data => {
      books.push({
        isbn,
        title: data.title || "Titre inconnu",
        author: data.authors ? data.authors.map(a=>a.name).join(", ") : "Auteur inconnu",
        read: false
      });
      save();
      input.value = "";
      stopScan();
    })
    .catch(() => {
      books.push({
        isbn,
        title: "À compléter",
        author: "À compléter",
        read: false
      });
      save();
      input.value = "";
      alert("Livre ajouté sans infos automatiques");
    });
}

// Bouton Lu / Non lu
function toggleRead(index) {
  books[index].read = !books[index].read;
  save();
}

// Scanner
function startScan() {
  if (qr) stopScan();
  qr = new Html5Qrcode("reader");
  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250, experimentalFeatures: { useBarCodeDetectorIfSupported: true } },
    text => {
      document.getElementById("isbn").value = text;
      stopScan();
    },
    err => {}
  );
}

// Fermer scanner
function stopScan() {
  if (qr) {
    qr.stop().then(() => {
      qr.clear();
      document.getElementById("reader").innerHTML = "";
      qr = null;
    }).catch(err => console.log(err));
  }
}

render();
</script>

</body>
</html>
